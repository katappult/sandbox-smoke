server.servlet.context-path=/
server.port=8080
spring.jpa.properties.hibernate.default_batch_fetch_size=25
# ----------------------------------------
# HEALTHCHECK
# ----------------------------------------
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name:app}

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC

# ----------------------------------------
# SERVER
# ----------------------------------------
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-connections=8000
server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-keep-alive-requests=100
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ----------------------------------------
# LOGS
# ----------------------------------------
logging.level.root=ERROR
logging.level.com.katappult=ERROR
logging.level.org.springframework=ERROR

spring.main.allow-bean-definition-overriding=true
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB
spring.jackson.default-property-inclusion=NON_NULL

spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.main.allow-circular-references=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions = true
# ----------------------------------------
# EMAIL PROPERTIES
# ----------------------------------------
spring.mail.primary.host=
spring.mail.primary.port=465
spring.mail.primary.username=
spring.mail.primary.password=

spring.mail.secondary.host=
spring.mail.secondary.port=465
spring.mail.secondary.username=
spring.mail.secondary.password=
# ----------------------------------------
#  LIQUIBASE
# ----------------------------------------
spring.liquibase.enabled=false
# ----------------------------------------
# APP
# ----------------------------------------
katappult.email.active=true
katappult.email.app.title.name=_change_me_
katappult.email.app.signature=_change_me_
katappult.application.cors.allowed.url=http://localhost:3000;http://localhost:3001:http://localhost:8080;

jwt.claims.app=testing-${project.version}
jwt.claims.env=dev
jwt.sign.with.secret=sign-with-katappult-generated-project-secret-key-min32bytes!

spring.jpa.packageToScan=com.katappult;com.katappult.cloud.platform.generated